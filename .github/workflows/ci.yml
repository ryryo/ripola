name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RSVP_ENABLE_PAID_GENERATION: 'false'
      GEMINI_API_KEY: ''
      RSVP_AI_GATEWAY_TRANSPORT: wrangler
      RSVP_AI_GATEWAY_ACCOUNT_ID: ''
      RSVP_AI_GATEWAY_TOKEN: ''
      RSVP_AI_GATEWAY_ID: ''
      RSVP_LIBRARY_DIR: ${{ github.workspace }}/.rsvp-data/qa-fixture-library
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 12.3.4
      - name: Media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: python3 scripts/test_align_audio.py
      - run: pnpm build:worker
      - run: pnpm build:pages
      - run: pnpm audit:audio --distribution dist/distribution/worker
      - run: pnpm audit:audio --distribution dist/distribution/pages
      - name: Source package
        working-directory: apps/web
        run: npm pack --dry-run --ignore-scripts
      - run: pnpm test:e2e
