name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RSVP_ENABLE_PAID_GENERATION: 'false'
      GEMINI_API_KEY: ''
      RSVP_AI_GATEWAY_TRANSPORT: wrangler
      RSVP_AI_GATEWAY_ACCOUNT_ID: ''
      RSVP_AI_GATEWAY_TOKEN: ''
      RSVP_AI_GATEWAY_ID: ''
      RSVP_LIBRARY_DIR: ${{ github.workspace }}/.rsvp-data/qa-fixture-library
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 12.3.4
      - name: Media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Python calculation tests
        run: |
          python3 -m venv "$RUNNER_TEMP/ripola-python-test"
          "$RUNNER_TEMP/ripola-python-test/bin/python" -m pip install numpy==2.3.5
          "$RUNNER_TEMP/ripola-python-test/bin/python" scripts/test_align_audio.py
      - run: pnpm build:worker
      - run: pnpm build:pages
      - run: pnpm audit:audio --distribution dist/distribution/worker
      - run: pnpm audit:audio --distribution dist/distribution/pages
      - name: Source package
        working-directory: apps/web
        run: npm pack --dry-run --ignore-scripts
      - run: pnpm test:e2e
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload audited public demo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/distribution/pages
  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy audited public demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
