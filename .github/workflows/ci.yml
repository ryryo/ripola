name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    # Cancellation is scoped to checking; it never interrupts a Pages deployment.
    concurrency:
      group: ci-${{ github.event_name == 'workflow_dispatch' && 'full' || 'fast' }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      code: ${{ steps.scope.outputs.code }}
    env:
      RSVP_ENABLE_PAID_GENERATION: 'false'
      GEMINI_API_KEY: ''
      RSVP_AI_GATEWAY_TRANSPORT: wrangler
      RSVP_AI_GATEWAY_ACCOUNT_ID: ''
      RSVP_AI_GATEWAY_TOKEN: ''
      RSVP_AI_GATEWAY_ID: ''
      RSVP_LIBRARY_DIR: ${{ github.workspace }}/.rsvp-data/qa-fixture-library
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify all changed paths
        id: scope
        run: node scripts/ci-classify.mjs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        if: steps.scope.outputs.code == 'true'
        with:
          version: 12.3.4
      - name: Media tools
        timeout-minutes: 3
        if: steps.scope.outputs.code == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.code == 'true'
      - run: pnpm check
        if: steps.scope.outputs.code == 'true'
      - name: Python calculation tests
        if: steps.scope.outputs.code == 'true' && steps.scope.outputs.python == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/ripola-python-test"
          "$RUNNER_TEMP/ripola-python-test/bin/python" -m pip install numpy==2.3.5
          "$RUNNER_TEMP/ripola-python-test/bin/python" scripts/test_align_audio.py
          "$RUNNER_TEMP/ripola-python-test/bin/python" scripts/test_check_alignment_runtime.py
      # Each distribution build audits the final bytes before committing its output.
      - run: pnpm build:worker
        if: steps.scope.outputs.code == 'true'
      - run: pnpm build:pages
        if: steps.scope.outputs.code == 'true'
      - name: Source package
        if: steps.scope.outputs.code == 'true'
        working-directory: apps/web
        run: npm pack --dry-run --ignore-scripts
      - name: Browser smoke and focused regressions (manual dispatch runs full)
        if: steps.scope.outputs.code == 'true'
        env:
          RIPOLA_CI_MODE: ${{ steps.scope.outputs.mode }}
          RIPOLA_CI_DOMAINS: ${{ steps.scope.outputs.domains }}
        run: pnpm test:ci-browser
      - name: Configure Pages
        if: steps.scope.outputs.code == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload audited public demo from this checked SHA
        if: steps.scope.outputs.code == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/distribution/pages
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.outputs.code == 'true'
    needs: check
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Skip stale main SHA before publishing
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main SHA exists; skipping stale deployment.'
          fi
      - name: Deploy audited public demo
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
